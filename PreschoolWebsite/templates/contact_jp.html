<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'header_jp.html' %}
    <style>
      form {
        display: flex;
        flex-direction: column;
      }
      input, textarea {
        padding: 10px;
        border-radius: 5px;
        border: 1px solid black;
        background-color: #fff;
        width: 100%;
        font-family: Arial, sans-serif;
        font-size: 1vw;
      }
      button {
        background-color: #2382c2;
        color: #fff;
        padding: 2% 2.5%;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 1.2vw;
      }
      button:hover {
        background-color: #0350af;
      }
    </style>
</head>
<body>
    {% include 'navbar_jp.html' %}
    <div class="container">
    <div class="grid-container"
            style="
              grid-template-columns: 1fr 1fr;
              grid-template-rows: 1;
            " >

        <div class="box" style="grid-column: 1/3; background-color: #fff;">
            <div class="sub-grid-container" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                                                   background-color: #fff; align-items: center;">

                <div class="sub-box" style=" padding-bottom:10%; background-color: #fff;">
                    <p style="background-color: #fff; text-size: 40%;">そよかぜ幼稚園では、すでに日本語に触れたご経験があり、ご家庭でも日本語に親しめる環境にあるお子さまを優先的にご案内しております。
詳細についてのお問い合わせや、入園待機リストへのご登録をご希望の方は、どうぞお気軽にご連絡ください。</p>
                </div>
                <div class="sub-box" style="background-color: #fff; border-radius: 10px;
                                        padding: 0%;
                                        ">
                       <form class="grid-container" action = "" method = "post" style="
                          grid-template-columns: 1fr 1fr 1fr 1fr;
                          grid-template-rows: 4;
                          background-color: #faf7d9;
                          border-radius: 10px;
                          padding-right: 10%;
                        " >
                            <div style="grid-column: 1/2; grid-row: 1/2; display:flex; justify-content: right; align-items:center; font-size: clamp(60%, 1.7vw, 1.3rem);">
                                 <label for="name">お名前</label>
                            </div>
                            <div style="grid-column: 2/5; grid-row: 1/2; display: flex; align-items: center; font-size: clamp(60%, 1.7vw, 1.3rem);">
                                <input type="text" name="name" id="name" placeholder="Name" />
                            </div>
                            <div style="grid-column: 1/2; grid-row: 2/3; display:flex; justify-content: right; align-items:center; font-size: clamp(60%, 1.7vw, 1.3rem);">
                              <label for="email">メールアドレス</label>
                            </div>
                            <div style="grid-column: 2/5; grid-row: 2/3; display: flex; align-items: center;">
                                <input type="email" name="email" id="email" placeholder="Email" />
                            </div>
                            <div style="grid-column: 1/2; grid-row: 3/4; display:flex; justify-content: right; align-items: center; font-size: clamp(60%, 1.7vw, 1.3rem);">
                                <label for="message">お問い合わせ内容</label>
                            </div>
                            <div style="grid-column: 2/5; grid-row: 3/4; display: flex; align-items: center;">
                                <textarea name="message" id="message" placeholder="Message" rows="10"></textarea>
                            </div>
                            <div style="grid-column: 1/5; grid-row: 4/5; display:flex; justify-content: center;">
                               <button type="送信" name="submit_msg">Submit</button>
                            </div>
                        </form>
                   </div>

            </div>
        </div>
        </div>
    <div style="padding-top: 15%"></div>
        {% include 'footer_jp.html' %}

</body>
</html>
